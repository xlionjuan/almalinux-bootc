name: Cleanup Old Images
on:
  schedule:
    - cron: "15 18 * * 2" # Runs at 18:15, only on Tuesday. 
  workflow_dispatch:

jobs:
  delete-older-than-60:
    runs-on: ubuntu-26.04-arm
    permissions:
      packages: write
    steps:
      - name: Delete Images Older Than 60 Days
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1
        with:
          packages: almalinux-bootc
          older-than: 60 days
          delete-orphaned-images: true
          keep-n-tagged: 7
          keep-n-untagged: 7
