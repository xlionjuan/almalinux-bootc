name: Reusable Build and Push
on:
  workflow_call:
    inputs:
      path:
        description: "The path of the Containerfile, eg. main"
        required: true
        type: string
      runner:
        description: "Runner, use when need ARM64 runner"
        required: false
        type: string
        default: ubuntu-latest
      push_to_ghcr:
        description: "Push to ghcr.io"
        required: false
        type: boolean
        default: true
      max_space:
        description: "Maximize build space"
        required: false
        type: boolean
        default: false
      tag:
        description: Only one line
        required: true
        type: string
        default: ""
      extra_tags:
        description: |
          "Extra Tags, ONE TAG ONE LINE, ex:
            type=raw,value=test
            type=raw,value=py311
            type=raw,value=py311-{{date 'YYYYMMDD'}}
          "
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ${{ inputs.runner }}
    permissions:
      packages: write
      # id-token: write # needed for signing the images with GitHub OIDC Token
      # attestations: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # - name: Install Cosign
      #   uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      # - name: Verify
      #   shell: bash
      #   run: |
      #     set -oue pipefail
      #     echo "---Grep image name---"
      #     containerfile_path="${{ inputs.path }}/Containerfile"
      #     image=$(grep -i '^FROM' "$containerfile_path" | awk '{print $2}')
      #     echo "Image: "${image}""
      #     echo ""
      #     echo "Using Cosign to verify image..."
      #     cosign verify \
      #       --key https://raw.githubusercontent.com/ublue-os/ucore/refs/heads/main/cosign.pub \
      #       "${image}"

      - name: Maximize build space
        if: ${{ inputs.max_space == true }}
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
             type=raw,value=${{ inputs.tag }}-{{date 'YYYYMMDD'}},enable={{is_default_branch}}
             type=raw,value=${{ inputs.tag }},enable={{is_default_branch}}
             type=ref,event=pr,suffix=-${{ inputs.tag }}
             ${{ inputs.extra_tags }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/main/README.md
            org.opencontainers.image.description=Custom AlmaLinux image, tag ${{ inputs.tag }}.
            org.opencontainers.image.title=XLion-AlmaLinux-Bootc-${{ inputs.tag }}

      - name: Login ghcr.io
        if: ${{ inputs.push_to_ghcr == true }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildah Action
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          context: ${{ inputs.path }}
          containerfiles: ${{ inputs.path }}/Containerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          oci: true
          extra-args:

      - name: Rechunk image with Chunkah
        shell: bash
        env:
          SOURCE_IMAGE: ${{ steps.build-image.outputs.image-with-tag }}
          IMAGE_TAGS: ${{ steps.build-image.outputs.tags }}
          CHUNKAH_IMAGE: quay.io/coreos/chunkah:v0.6.0
        run: |
          CHUNKAH_OUTPUT_DIR="$(mktemp -d)"
          CHUNKAH_CONFIG_FILE="$(mktemp)"

          podman inspect "$SOURCE_IMAGE" > "$CHUNKAH_CONFIG_FILE"

          podman pull "$CHUNKAH_IMAGE"

          podman run --rm \
            --pull=never \
            --mount=type=image,src="$SOURCE_IMAGE",target=/chunkah \
            -v "$CHUNKAH_CONFIG_FILE:/chunkah-config.json:ro" \
            -v "$CHUNKAH_OUTPUT_DIR:/run/out" \
            "$CHUNKAH_IMAGE" \
            build \
            --prune /sysroot/ \
            --max-layers 480 \
            --label ostree.commit- \
            --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"

          while IFS= read -r tag; do
            podman tag "$CHUNKED_IMAGE" "$tag"
          done <<< "$IMAGE_TAGS"

          rm -f "$CHUNKAH_CONFIG_FILE"
          rm -rf "$CHUNKAH_OUTPUT_DIR"

      - name: Push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        if: ${{ inputs.push_to_ghcr == true }}
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io
          extra-args: |
            --compression-format=zstd

      # https://github.com/podman-container-tools/podman/issues/27796
      - name: Push (2nd)
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        if: ${{ inputs.push_to_ghcr == true }}
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io
          extra-args: |
            --compression-format=zstd

      # - name: Sign the images with GitHub OIDC Token
      #   if: ${{ inputs.push_to_ghcr == true }} && github.event_name != 'pull_request'
      #   env:
      #     DIGEST: ${{ steps.push.outputs.digest }}
      #     TAGS: ${{ steps.meta.outputs.tags }}
      #   run: |
      #     images=""
      #     for tag in ${TAGS}; do
      #       images+="${tag}@${DIGEST} "
      #     done
      #     cosign sign --yes ${images}

